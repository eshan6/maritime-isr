<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Maritime ISR — Maritime Intelligence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#ffffff; --rail:#f7f8fa; --line:#e3e6ea; --line2:#eceef1;
  --ink:#1f2933; --ink2:#374151; --muted:#6b7280; --faint:#9aa3ad;
  --blue:#1a5fb4; --blue2:#2563eb; --blue-bg:#eef4fb; --blue-line:#cddffb;
  --red:#dc2626; --red-bg:#fdecec; --amber:#b45309; --amber-bg:#fdf4e6;
  --green:#0f7b43; --green-bg:#eaf6ef;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13px;color:var(--ink2);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
.app{display:flex;height:100vh;overflow:hidden}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;height:48px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 16px;z-index:1000;gap:12px}
#top .logo{width:22px;height:22px;background:var(--blue);border-radius:5px;color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:13px}
#top .title{font-weight:600;color:var(--ink);font-size:14px}
#top .sub{color:var(--faint);font-size:12px}
#top .right{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}
#top .live{display:flex;align-items:center;gap:5px}
#top .dot{width:7px;height:7px;border-radius:4px;background:var(--green)}
/* layout */
#nav{width:190px;background:var(--rail);border-right:1px solid var(--line);padding:12px 0;
  margin-top:48px;flex-shrink:0;overflow-y:auto}
#nav .grp{padding:6px 16px 4px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
#nav a{display:flex;justify-content:space-between;padding:6px 16px;color:var(--ink2);font-size:13px;cursor:pointer}
#nav a:hover{background:#eef1f4}
#nav a.on{background:var(--blue-bg);color:var(--blue);border-right:2px solid var(--blue);font-weight:500}
#nav a .ct{color:var(--faint);font-size:11px}
#nav .foot{padding:14px 16px;color:var(--faint);font-size:11px;line-height:1.5;margin-top:8px;border-top:1px solid var(--line)}
#main{flex:1;margin-top:48px;overflow-y:auto;background:#fff}
.view{display:none;padding:20px 24px}
.view.on{display:block}
h1{font-size:17px;color:var(--ink);font-weight:600;margin:0 0 3px}
.crumb{color:var(--muted);font-size:12px;margin-bottom:18px}
/* cards + tables */
.row{display:flex;gap:16px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:16px}
.card .hd{padding:10px 14px;border-bottom:1px solid var(--line2);font-weight:600;color:var(--ink);
  font-size:13px;display:flex;justify-content:space-between;align-items:center}
.card .bd{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.kpi{background:#fff;padding:14px 16px}
.kpi .n{font-size:24px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
.kpi .n.red{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.02em;text-transform:uppercase;background:#fbfcfd;position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--line2);color:var(--ink2)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--blue-bg)}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.tag.blue{background:var(--blue-bg);color:var(--blue)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.grey{background:#f0f2f4;color:var(--muted)}
.pill{padding:2px 8px;border:1px solid var(--line);border-radius:4px;font-size:12px;background:#fff;
  cursor:pointer;color:var(--ink2)}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;
  font-size:12.5px;color:var(--ink2);font-weight:500}
.btn:hover{background:#f4f6f8}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{background:var(--blue2)}
/* map */
#map{height:calc(100vh - 48px)}
.mapwrap{position:relative}
.overlay{position:absolute;z-index:500;background:#fff;border:1px solid var(--line);border-radius:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:12px}
#legend{top:12px;right:12px;padding:10px 12px}
#legend .li{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--ink2)}
#legend .sw{width:11px;height:11px;border-radius:6px}
#legend .sw.sq{border-radius:2px}
#scrub{bottom:12px;left:12px;right:12px;padding:10px 14px;display:flex;align-items:center;gap:12px}
#scrub input[type=range]{flex:1}
#scrub .t{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--ink);min-width:135px}
#scrub .play{width:30px;height:30px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer}
.leaflet-popup-content{font-size:12px}
/* entity + alert detail */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:12.5px}
.kv .k{color:var(--muted)}
.chain{border-left:2px solid var(--blue-line);padding-left:12px;margin:6px 0}
.chain .step{margin:5px 0;font-size:12px}
.chain .edge{color:var(--blue);font-weight:500}
.risk-bar{height:20px;background:#f0f2f4;border-radius:3px;overflow:hidden;display:flex}
.risk-seg{height:100%}
.risk-row{display:grid;grid-template-columns:160px 1fr 60px;gap:10px;align-items:center;margin:5px 0;font-size:12px}
.dispbtns{display:flex;gap:6px}
.back{color:var(--blue);cursor:pointer;font-size:12px;margin-bottom:12px;display:inline-block}
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--faint)}
</style></head>
<body>
<div id="top">
  <div class="logo">B</div>
  <div class="title">Maritime ISR</div>
  <div class="sub">Maritime Domain Awareness — Arabian Sea AOI</div>
  <div class="right">
    <span>As of <span id="asof" class="mono"></span></span>
    <span class="live"><span class="dot"></span>Live</span>
    <span>v0.7.0</span>
  </div>
</div>
<div class="app">
  <div id="nav">
    <div class="grp">Operations</div>
    <a data-v="overview" class="on">Overview</a>
    <a data-v="map">Map</a>
    <a data-v="alerts">Alerts <span class="ct" id="nav-alerts"></span></a>
    <a data-v="vessels">Vessels <span class="ct" id="nav-vessels"></span></a>
    <a data-v="risk">Risk board</a>
    <a data-v="reports">Reports</a>
    <div class="grp">Reference</div>
    <a data-v="provenance">Provenance</a>
    <div class="foot">Decision-support layer.<br/>Synthetic data; proof of functionality.</div>
  </div>
  <div id="main">
    <div class="view on" id="v-overview"></div>
    <div class="view" id="v-map"><div class="mapwrap">
      <div id="map"></div>
      <div class="overlay" id="legend"></div>
      <div class="overlay" id="scrub">
        <button class="play" id="playbtn">&#9654;</button>
        <span class="t" id="scrubt"></span>
        <input type="range" id="scrubr" min="0" max="59" value="59"/>
        <span class="muted" id="scrubn"></span>
      </div>
    </div></div>
    <div class="view" id="v-alerts"></div>
    <div class="view" id="v-vessels"></div>
    <div class="view" id="v-risk"></div>
    <div class="view" id="v-reports"></div>
    <div class="view" id="v-provenance"></div>
  </div>
</div>
<script>
const SNAP = __SNAP__;
const RCOL = __RCOL__;
const TYPE_TAG = __TYPETAG__;
</script>
<script>__JS__</script>
</body></html>
