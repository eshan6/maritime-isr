# Render blueprint for the Maritime ISR demo API.
#
# WHY RENDER AND NOT THE OBVIOUS PLACES
# -------------------------------------
# Hugging Face moved the Docker SDK behind a paid plan, so the Dockerfile in
# deploy/huggingface has nowhere free to run. Vercel's Python functions cap the
# bundle at 250 MB unzipped and this API pulls pyarrow (156 MB), pandas (76 MB)
# and numpy (45 MB) at import — 294 MB of dependencies before a byte of corpus.
# Render's free tier is 512 MB of RAM with no credit card, and the API fits —
# but only since the serving layer stopped materialising whole tables.
#
# MEMORY, MEASURED RATHER THAN ASSUMED
# ------------------------------------
# The 228 MB this file used to quote was measured before the fleet tripled and
# was wrong in a way that mattered. Three endpoints read a whole table into
# Python to return a fraction of it: `/radar/tracks` and `/voi/workload` cost
# ~560 MB apiece and peaked at 1.3 GB, and `/tracks` rebuilt every fix of every
# hull twice before keeping ~160 of them. All three now decimate or count in
# SQL, so only what is returned is ever built.
#
# What remains scales with how many requests run at once, which is why
# `MISR_MAX_CONCURRENT_QUERIES` exists. Measured on the scenario corpus, ten
# simultaneous viewers:
#
#     bound = 1 -> 344 MB        bound = 2 -> 399 MB       unbounded -> 650 MB+
#
# A cap in the browser cannot do this job, because it is per-page and two
# viewers simply double it.
#
# These numbers are from a 206 MB local corpus and the published one is larger.
# Three deploys running code that measured comfortably here were still killed,
# so the bound is set where being wrong again is survivable rather than where
# the measurement says it just fits.
#
# THE ONE REAL WEAKNESS, AND THE FIX
# ----------------------------------
# A free service spins down after 15 minutes idle and takes about a minute to
# come back. For a demo opened in front of people that is the whole ballgame,
# so `deploy/README.md` sets up a free uptime pinger to keep it awake. The free
# allowance is 750 instance-hours a month, which is more than a calendar month,
# so keeping one service warm around the clock costs nothing.
#
# CPU is 0.1 of a core. Locally the heaviest endpoint answers in 0.17 s; expect
# meaningfully slower here and measure it rather than quoting the local number.

services:
  - type: web
    name: maritime-isr-api
    runtime: python
    plan: free
    region: singapore          # nearest region to the Arabian Sea AOI and to India
    branch: main
    # Render's own advice for button-deployed blueprints: a push to this
    # repository must not redeploy every copy someone has spun up from it.
    autoDeploy: false

    # `[api]` only. The pans extra pulls reportlab/pypdf/pillow, which the
    # SERVING path never uses — documents are generated on the laptop and
    # landed, and the API only reads the landed rows.
    buildCommand: |
      pip install --upgrade pip
      pip install -e ".[api]"
      python deploy/render/fetch_corpus.py

    # 0.0.0.0 rather than the laptop default of 127.0.0.1, or Render's proxy
    # cannot reach the process and every request 502s.
    startCommand: uvicorn maritime_isr.api.app:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MISR_STORE_BACKEND
        value: local
      - key: MISR_DATA_ROOT
        value: /opt/render/project/src/data
      # These three bound memory. All of them are also the code's defaults, and
      # that is deliberate: Render applies a blueprint's env vars when the
      # BLUEPRINT syncs, not when code is redeployed, so a variable added here
      # may simply not exist on an already-running service. Anything the
      # service needs in order not to be OOM-killed has to be correct with no
      # environment at all; these entries document the dials and make them
      # editable, they are not what makes it safe.
      #
      # DuckDB sizes its buffer pool at 80% of the MACHINE's RAM and takes one
      # thread per host core — inside a 512 MB container on a big shared host
      # that is a promise to itself the kernel will not keep, and it is what
      # kept killing this service after the per-query fixes had landed.
      - key: MISR_DUCKDB_MEMORY_LIMIT
        value: "128MB"
      - key: MISR_DUCKDB_THREADS
        value: "2"
      # How many queries may run at once. One, deliberately: serialised
      # queries make the map fill in visibly rather than all at once, and the
      # alternative on this host was being OOM-killed mid-load and restarted
      # cold, which is not slower but absent. Raise it once the deploy is known
      # stable, or on a host with more than 512 MB.
      - key: MISR_MAX_CONCURRENT_QUERIES
        value: "1"
      # Where fetch_corpus.py pulls the corpus from. Set this in the Render
      # dashboard to the GitHub Release asset URL — see deploy/README.md. It is
      # not a secret; it is public synthetic data.
      - key: MISR_CORPUS_URL
        sync: false
