[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-isr"
version = "0.7.0"
description = "Fusion intelligence for the Arabian Sea / Indian west-coast EEZ — live-data ingestion (Sentinel-1, AIS, registries) plus a synthetic end-to-end prototype: SAR/AIS fusion, dark-vessel detection, object graph, anomaly library, analyst product surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # shared core
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "h3>=4.0",
    # live-data path (execution-spec units 0.0-0.5)
    "pydantic>=2.6",
    "duckdb>=0.10",
    "pytz>=2024.1",       # duckdb TIMESTAMPTZ parameter binding
    "requests>=2.31",
    "websockets>=12.0",
    "boto3>=1.34",
    "shapely>=2.0",
    # Reading a published maritime-boundary shapefile (ADR-030). PURE PYTHON —
    # no GDAL, no fiona, no geopandas, so `pip install -e .` on a Windows laptop
    # stays a download rather than a compiler problem. Marine Regions ships
    # shapefile, GeoPackage and KML but not GeoJSON, so without this the zone
    # connector is a door nobody can walk through.
    "pyshp>=2.3",
    # synthetic prototype (Phases 1-6)
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "global-land-mask>=1.0",
]

[project.optional-dependencies]
sar = ["pyroSAR>=0.25", "rasterio>=1.3"]
# Area 4 — arrival notifications (ADR-036). Reading and writing the formats the
# requirement names: PDF, Word and spreadsheet.
#
# **Optional, and the extractor degrades per format rather than per install.**
# A laptop without `python-docx` still reads the spreadsheets and the PDFs, and
# says which formats it could not open instead of failing to import. The
# requirement's own framing is that the input is whatever arrives by email; a
# connector that refuses to start because one reader is missing is worse than
# one that reads three formats and reports the fourth as unread.
#
# OCR is separately optional and separately reported: `pytesseract` is a wrapper
# around a *binary* that pip cannot install, so it is the one dependency here
# that can be present and still not work. See `ingest.pans.readers`.
pans = ["python-docx>=1.1", "openpyxl>=3.1", "reportlab>=4.0", "pypdf>=4.0",
        "pillow>=10.0"]
ocr = ["pytesseract>=0.3"]
# Phase 6 serving layer (maritime_isr/api). Kept optional so the ingest/CLI path
# has no web dependency; install with `pip install -e ".[api]"` to run the API.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.4", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
       "python-docx>=1.1", "openpyxl>=3.1", "reportlab>=4.0", "pypdf>=4.0",
       "pillow>=10.0", "pytesseract>=0.3"]

[project.scripts]
maritime-isr = "maritime_isr.cli:main"

[tool.setuptools.packages.find]
include = ["maritime_isr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs that take minutes (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
