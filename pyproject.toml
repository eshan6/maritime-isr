[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maritime-isr"
version = "0.7.0"
description = "Fusion intelligence for the Arabian Sea / Indian west-coast EEZ — live-data ingestion (Sentinel-1, AIS, registries) plus a synthetic end-to-end prototype: SAR/AIS fusion, dark-vessel detection, object graph, anomaly library, analyst product surface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # shared core
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "h3>=4.0",
    # live-data path (execution-spec units 0.0-0.5)
    "pydantic>=2.6",
    "duckdb>=0.10",
    "pytz>=2024.1",       # duckdb TIMESTAMPTZ parameter binding
    "requests>=2.31",
    "websockets>=12.0",
    "boto3>=1.34",
    "shapely>=2.0",
    # synthetic prototype (Phases 1-6)
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "global-land-mask>=1.0",
]

[project.optional-dependencies]
sar = ["pyroSAR>=0.25", "rasterio>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
maritime-isr = "maritime_isr.cli:main"

[tool.setuptools.packages.find]
include = ["maritime_isr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
