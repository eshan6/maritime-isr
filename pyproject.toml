[project]
name = "maritime-isr"
version = "0.0.0"
description = "Fusion intelligence for the Arabian Sea / Indian west-coast EEZ (free-path prototype)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "duckdb>=0.10",
    "h3>=4.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "websockets>=12.0",
    "boto3>=1.34",
    "shapely>=2.0",
]

[project.optional-dependencies]
sar = ["pyroSAR>=0.25", "rasterio>=1.3", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
maritime-isr = "maritime_isr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maritime_isr*"]

[tool.ruff]
line-length = 100
target-version = "py311"
